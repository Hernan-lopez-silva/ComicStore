[pytest]
# Pytest configuration for ComicStore Selenium tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra

# Markers for test categorization
markers =
    authentication: Autenticación y login (RF-01, RF-02, RF-05)
    catalog: Catálogo y búsqueda de productos (RF-06, RF-07, RF-08, RF-09, RF-10)
    cart: Carrito de compras (RF-03, RF-04, RF-11)
    checkout: Checkout y resumen de pedido (RF-12)
    discounts: Descuentos y cupones (RF-13)
    smoke: Pruebas críticas de flujo principal
    slow: Pruebas que tardan más tiempo
    integration: Pruebas de integración
    regression: Pruebas de regresión

# Timeout
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG
